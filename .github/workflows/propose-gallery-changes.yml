name: Propose gallery changes (report only)

on:
  schedule:
    - cron: "11 6 * * 4"
  workflow_dispatch:
    inputs:
      discovery_run_id:
        description: Successful Discover gallery content run ID for this exact commit
        required: false
        type: string
      health_run_id:
        description: Successful Scan gallery health run ID for this exact commit
        required: false
        type: string
      freshness_run_id:
        description: Successful Evaluate repository freshness run ID for this exact commit
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: gallery-proposal-report-only
  cancel-in-progress: false

jobs:
  propose:
    name: Build catalog proposal artifacts without mutation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve and verify exact upstream artifacts
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROPOSAL_RUN_ID: ${{ github.run_id }}
          TRUSTED_REF: ${{ github.ref }}
          TRUSTED_SHA: ${{ github.sha }}
          DISCOVERY_RUN_ID: ${{ inputs.discovery_run_id }}
          HEALTH_RUN_ID: ${{ inputs.health_run_id }}
          FRESHNESS_RUN_ID: ${{ inputs.freshness_run_id }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p proposal-inputs/discovery proposal-inputs/health proposal-inputs/freshness gallery-proposal
          diagnostics_lines="$(mktemp)"
          manifest_lines="$(mktemp)"
          overall_status="failed"
          workflow_started_at=""
          : > "$diagnostics_lines"
          : > "$manifest_lines"

          record_check() {
            jq -nc \
              --arg name "$1" \
              --arg status "$2" \
              --arg message "$3" \
              '{name: $name, status: $status, message: $message}' >> "$diagnostics_lines"
          }

          write_diagnostics() {
            jq -n \
              --arg status "$overall_status" \
              --arg repository "$GH_REPO" \
              --arg trustedRef "$TRUSTED_REF" \
              --arg trustedSha "$TRUSTED_SHA" \
              --arg workflowRunId "$PROPOSAL_RUN_ID" \
              --arg workflowStartedAt "$workflow_started_at" \
              --slurpfile checks "$diagnostics_lines" \
              '{
                schemaVersion: "1.0.0",
                status: $status,
                repository: $repository,
                trustedRef: $trustedRef,
                trustedSha: $trustedSha,
                workflowRunId: $workflowRunId,
                workflowStartedAt: (if $workflowStartedAt == "" then null else $workflowStartedAt end),
                checks: $checks
              }' > gallery-proposal/upstream-artifact-diagnostics.json
          }

          finalize_diagnostics() {
            local exit_code=$?
            trap - EXIT
            if ! write_diagnostics; then
              printf 'Failed to finalize upstream artifact diagnostics.\n' >&2
            fi
            exit "$exit_code"
          }

          if ! write_diagnostics; then
            printf 'Failed to initialize upstream artifact diagnostics.\n' >&2
            exit 1
          fi
          trap finalize_diagnostics EXIT

          if [[ "$TRUSTED_REF" != refs/heads/* ]]; then
            record_check "proposal-context" "failed" "The proposal ref is not a branch ref."
            exit 1
          fi
          expected_branch="${TRUSTED_REF#refs/heads/}"
          checkout_sha="$(git rev-parse HEAD)"
          if [ "$checkout_sha" != "$TRUSTED_SHA" ]; then
            record_check "proposal-context" "failed" "The checkout SHA differs from the trusted workflow SHA."
            exit 1
          fi
          if ! proposal_run_json="$(gh api "repos/${GH_REPO}/actions/runs/${PROPOSAL_RUN_ID}")"; then
            record_check "proposal-context" "failed" "The proposal workflow run could not be read."
            exit 1
          fi
          if ! workflow_started_at="$(jq -er '.run_started_at // .created_at' <<< "$proposal_run_json")"; then
            record_check "proposal-context" "failed" "The proposal workflow start timestamp is unavailable."
            exit 1
          fi
          record_check "proposal-context" "verified" "Checkout repository, branch ref, SHA, and workflow start are bound."

          resolve_artifact() {
            local name="$1"
            local workflow_file="$2"
            local workflow_path="$3"
            local artifact_prefix="$4"
            local requested_run_id="$5"
            local destination="$6"
            local required_files="$7"
            local workflow_json expected_workflow_id expected_workflow_path runs_json run_id run_json
            local run_attempt expected_artifact_name artifacts_json artifact_count artifact_json
            local artifact_id artifact_digest zip_path actual_digest required_file file_count

            if ! workflow_json="$(gh api "repos/${GH_REPO}/actions/workflows/${workflow_file}")"; then
              record_check "$name" "failed" "Expected producer workflow could not be read."
              return 1
            fi
            expected_workflow_id="$(jq -er '.id | tostring' <<< "$workflow_json")" || return 1
            expected_workflow_path="$(jq -er '.path' <<< "$workflow_json")" || return 1
            if [ "$expected_workflow_path" != "$workflow_path" ]; then
              record_check "$name" "failed" "Producer workflow path does not match the expected identity."
              return 1
            fi

            run_id="$requested_run_id"
            if [ -z "$run_id" ]; then
              if ! runs_json="$(gh api "repos/${GH_REPO}/actions/workflows/${workflow_file}/runs?status=completed&head_sha=${TRUSTED_SHA}&per_page=100")"; then
                record_check "$name" "failed" "Producer runs could not be listed."
                return 1
              fi
              run_id="$(jq -r \
                --arg repository "$GH_REPO" \
                --arg workflowId "$expected_workflow_id" \
                --arg workflowPath "$workflow_path" \
                --arg branch "$expected_branch" \
                --arg sha "$TRUSTED_SHA" \
                '[.workflow_runs[] | select(
                  .repository.full_name == $repository and
                  .head_repository.full_name == $repository and
                  (.workflow_id | tostring) == $workflowId and
                  .path == $workflowPath and
                  .head_branch == $branch and
                  .head_sha == $sha and
                  .status == "completed" and
                  .conclusion == "success"
                )] | if length == 0 then "" else (.[0].id | tostring) end' <<< "$runs_json")"
            fi
            if [[ ! "$run_id" =~ ^[1-9][0-9]*$ ]]; then
              record_check "$name" "failed" "No valid exact producer run ID was supplied or discovered."
              return 1
            fi
            if ! run_json="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}")"; then
              record_check "$name" "failed" "Producer run ${run_id} could not be read."
              return 1
            fi
            if ! jq -e \
              --arg repository "$GH_REPO" \
              --arg workflowId "$expected_workflow_id" \
              --arg workflowPath "$workflow_path" \
              --arg branch "$expected_branch" \
              --arg sha "$TRUSTED_SHA" \
              '(.repository.full_name == $repository) and
               (.head_repository.full_name == $repository) and
               ((.workflow_id | tostring) == $workflowId) and
               (.path == $workflowPath) and
               (.head_branch == $branch) and
               (.head_sha == $sha) and
               (.status == "completed") and
               (.conclusion == "success")' <<< "$run_json" > /dev/null; then
              record_check "$name" "failed" "Producer run ${run_id} failed repository, workflow, ref, SHA, or success validation."
              return 1
            fi

            run_attempt="$(jq -er '.run_attempt' <<< "$run_json")" || return 1
            expected_artifact_name="${artifact_prefix}${run_id}-${run_attempt}"
            if ! artifacts_json="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}/artifacts?per_page=100")"; then
              record_check "$name" "failed" "Artifacts for producer run ${run_id} could not be read."
              return 1
            fi
            artifact_count="$(jq --arg artifactName "$expected_artifact_name" \
              '[.artifacts[] | select(.name == $artifactName)] | length' <<< "$artifacts_json")"
            if [ "$artifact_count" -ne 1 ]; then
              record_check "$name" "failed" "Producer run ${run_id} does not have exactly one artifact named ${expected_artifact_name}."
              return 1
            fi
            artifact_json="$(jq -c --arg artifactName "$expected_artifact_name" \
              '.artifacts[] | select(.name == $artifactName)' <<< "$artifacts_json")"
            if ! jq -e '
              (.expired == false) and
              (((.id | tostring) | test("^[1-9][0-9]*$"))) and
              ((.digest | type) == "string") and
              (.digest | test("^sha256:[a-f0-9]{64}$"))
            ' <<< "$artifact_json" > /dev/null; then
              record_check "$name" "failed" "Artifact ${expected_artifact_name} has no valid ID or SHA-256 digest, or is expired."
              return 1
            fi

            artifact_id="$(jq -r '.id | tostring' <<< "$artifact_json")"
            artifact_digest="$(jq -r '.digest' <<< "$artifact_json")"
            zip_path="proposal-inputs/${name}-${artifact_id}.zip"
            if ! gh api "repos/${GH_REPO}/actions/artifacts/${artifact_id}/zip" > "$zip_path"; then
              record_check "$name" "failed" "Artifact ${artifact_id} could not be downloaded."
              return 1
            fi
            actual_digest="sha256:$(sha256sum "$zip_path" | cut -d ' ' -f 1)"
            if [ "$actual_digest" != "$artifact_digest" ]; then
              record_check "$name" "failed" "Artifact ${artifact_id} digest verification failed."
              return 1
            fi
            if ! unzip -q "$zip_path" -d "$destination"; then
              record_check "$name" "failed" "Artifact ${artifact_id} could not be extracted."
              return 1
            fi
            rm -f "$zip_path"

            while IFS= read -r required_file; do
              file_count="$(find "$destination" -type f -name "$required_file" | wc -l | tr -d ' ')"
              if [ "$file_count" -ne 1 ]; then
                record_check "$name" "failed" "Artifact ${artifact_id} does not contain exactly one ${required_file}."
                return 1
              fi
            done < <(tr ',' '\n' <<< "$required_files")

            jq -nc \
              --arg name "$name" \
              --arg repository "$GH_REPO" \
              --arg workflowId "$expected_workflow_id" \
              --arg workflowPath "$workflow_path" \
              --arg runId "$run_id" \
              --argjson runAttempt "$run_attempt" \
              --arg sourceRef "$TRUSTED_REF" \
              --arg sourceSha "$TRUSTED_SHA" \
              --arg artifactId "$artifact_id" \
              --arg artifactName "$expected_artifact_name" \
              --arg digest "$artifact_digest" \
              '{
                name: $name,
                repository: $repository,
                workflowId: $workflowId,
                workflowPath: $workflowPath,
                runId: $runId,
                runAttempt: $runAttempt,
                sourceRef: $sourceRef,
                sourceSha: $sourceSha,
                artifactId: $artifactId,
                artifactName: $artifactName,
                digest: $digest
              }' >> "$manifest_lines"
            record_check "$name" "verified" "Producer run ${run_id}, artifact ${artifact_id}, and digest ${artifact_digest} are bound and verified."
          }

          resolution_failed=0
          resolve_artifact \
            "discovery" \
            "discover-content.yml" \
            ".github/workflows/discover-content.yml" \
            "gallery-discovery-" \
            "$DISCOVERY_RUN_ID" \
            "proposal-inputs/discovery" \
            "discovery.json,candidate-gates.json" || resolution_failed=1
          resolve_artifact \
            "health" \
            "scan-gallery-health.yml" \
            ".github/workflows/scan-gallery-health.yml" \
            "gallery-health-" \
            "$HEALTH_RUN_ID" \
            "proposal-inputs/health" \
            "gallery-health-report.json" || resolution_failed=1
          resolve_artifact \
            "freshness" \
            "evaluate-repository-freshness.yml" \
            ".github/workflows/evaluate-repository-freshness.yml" \
            "gallery-freshness-" \
            "$FRESHNESS_RUN_ID" \
            "proposal-inputs/freshness" \
            "gallery-freshness.json" || resolution_failed=1

          if [ "$resolution_failed" -ne 0 ]; then
            exit 1
          fi
          jq -s '.' "$manifest_lines" > proposal-inputs/upstream-artifacts.json
          if ! jq -e '
            length == 3 and
            (map(.name) | unique | length) == 3 and
            all(.[];
              (.artifactId | test("^[1-9][0-9]*$")) and
              (.artifactName | type == "string") and
              (.digest | test("^sha256:[a-f0-9]{64}$"))
            )
          ' proposal-inputs/upstream-artifacts.json > /dev/null; then
            record_check "manifest" "failed" "The verified artifact manifest is incomplete."
            exit 1
          fi
          overall_status="verified"
          echo "workflow_started_at=${workflow_started_at}" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Generate report-only catalog proposals
        id: proposal
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          TRUSTED_REF: ${{ github.ref }}
          TRUSTED_SHA: ${{ github.sha }}
          WORKFLOW_STARTED_AT: ${{ steps.upstream.outputs.workflow_started_at }}
        shell: bash
        run: |
          set -euo pipefail
          single_file() {
            mapfile -t matches < <(find "$1" -type f -name "$2")
            if [ "${#matches[@]}" -ne 1 ]; then
              printf 'Expected exactly one %s beneath %s.\n' "$2" "$1" >&2
              return 1
            fi
            printf '%s' "${matches[0]}"
          }
          discovery="$(single_file proposal-inputs/discovery discovery.json)"
          candidate_gates="$(single_file proposal-inputs/discovery candidate-gates.json)"
          health="$(single_file proposal-inputs/health gallery-health-report.json)"
          freshness="$(single_file proposal-inputs/freshness gallery-freshness.json)"
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')"
          args=(
            --report-directory gallery-proposal
            --discovery "$discovery"
            --candidate-gates "$candidate_gates"
            --health "$health"
            --freshness "$freshness"
            --active static/templates.json
            --retired static/retired-templates.json
            --exemptions .github/gallery-pipeline/exemptions.json
            --policy .github/gallery-pipeline/policy.json
            --upstream-artifacts proposal-inputs/upstream-artifacts.json
            --run-id "proposal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            --generated-at "$generated_at"
            --workflow-started-at "$WORKFLOW_STARTED_AT"
            --trusted-repository "$GITHUB_REPOSITORY"
            --trusted-ref "$TRUSTED_REF"
            --trusted-sha "$TRUSTED_SHA"
          )
          set +e
          npm run gallery:propose -- "${args[@]}"
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 2 ]; then
            exit "$exit_code"
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Summarize proposal stage
        if: always()
        shell: bash
        run: |
          if [ -f gallery-proposal/proposal-report.json ]; then
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const report = JSON.parse(readFileSync("gallery-proposal/proposal-report.json", "utf8"));
              process.stdout.write(`### Gallery proposal\n\n` +
                `- Status: ${report.status}\n` +
                `- Plans: ${report.summary.plans}\n` +
                `- Operations: ${report.summary.operations}\n` +
                `- Rejected candidates: ${report.summary.rejectedCandidates}\n`);
            ' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### Gallery proposal\n\nProposal generation did not produce a report.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload proposal reports and proposed state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gallery-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: gallery-proposal/
          if-no-files-found: error
          retention-days: 30