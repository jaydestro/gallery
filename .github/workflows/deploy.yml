name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select gallery data source
        env:
          COSMOS_CATALOG_ENABLED: ${{ vars.ENABLE_GALLERY_COSMOS_CATALOG }}
          CONFIGURED_API_BASE_URL: ${{ vars.GALLERY_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${COSMOS_CATALOG_ENABLED:-false}" = "true" ]; then
            if [ -z "${CONFIGURED_API_BASE_URL:-}" ]; then
              echo "GALLERY_API_BASE_URL is required when the Cosmos catalog is enabled." >&2
              exit 1
            fi
            case "$CONFIGURED_API_BASE_URL" in
              https://*) ;;
              *) echo "GALLERY_API_BASE_URL must use HTTPS." >&2; exit 1 ;;
            esac
            echo "GALLERY_API_BASE_URL=$CONFIGURED_API_BASE_URL" >> "$GITHUB_ENV"
            echo "GALLERY_USE_STATIC_CATALOG=false" >> "$GITHUB_ENV"
          else
            echo "GALLERY_USE_STATIC_CATALOG=true" >> "$GITHUB_ENV"
          fi

      - name: Build website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
