name: Discover gallery content (dry run)

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-pipeline-scheduled-dry-run
  cancel-in-progress: false

jobs:
  discover:
    name: Discover content without mutation
    if: vars.GALLERY_PIPELINE_DRY_RUN_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover content in dry-run mode
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/gallery-pipeline/discover-content.mjs --dry-run > gallery-discovery.json

      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gallery-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: gallery-discovery.json
          if-no-files-found: error
          retention-days: 30