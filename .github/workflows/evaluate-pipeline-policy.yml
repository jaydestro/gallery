name: Evaluate pipeline policy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluate-pipeline-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-evaluation:
    name: Run deterministic policy fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic policy and model fixtures
        run: npm run gallery:test

  trusted-model-evaluation:
    name: Run trusted Azure model evaluation
    if: >-
      ${{
        vars.ENABLE_GALLERY_MODEL_EVALUATION == 'true' &&
        github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: gallery-model-evaluation
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate live evaluation configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${AZURE_CLIENT_ID:-}" ] || missing+=("AZURE_CLIENT_ID")
          [ -n "${AZURE_TENANT_ID:-}" ] || missing+=("AZURE_TENANT_ID")
          [ -n "${AZURE_SUBSCRIPTION_ID:-}" ] || missing+=("AZURE_SUBSCRIPTION_ID")
          [ -n "${AZURE_OPENAI_ENDPOINT:-}" ] || missing+=("AZURE_OPENAI_ENDPOINT")
          [ -n "${AZURE_OPENAI_DEPLOYMENT:-}" ] || missing+=("AZURE_OPENAI_DEPLOYMENT")
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Live model evaluation is enabled but required variables are missing: %s\n' \
              "${missing[*]}" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sign in to Azure with OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Evaluate configured Azure model
        env:
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_MODE: ${{ vars.AZURE_OPENAI_MODE || 'responses' }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint_host="$(node --input-type=module -e '
            const endpoint = new URL(process.env.AZURE_OPENAI_ENDPOINT);
            const approvedHost = (
              /^(?:[a-z0-9-]+\.)*?[a-z0-9-]+\.openai\.azure\.com$/i.test(endpoint.hostname) ||
              /^(?:[a-z0-9-]+\.)*?[a-z0-9-]+\.services\.ai\.azure\.com$/i.test(endpoint.hostname)
            );
            if (
              endpoint.protocol !== "https:" || endpoint.username || endpoint.password ||
              endpoint.port || !approvedHost || !["", "/"].includes(endpoint.pathname) ||
              endpoint.search || endpoint.hash
            ) process.exit(1);
            process.stdout.write(endpoint.hostname);
          ')"
          case "$endpoint_host" in
            *.openai.azure.com|*.services.ai.azure.com)
              token_resource="https://cognitiveservices.azure.com/"
              ;;
            *)
              echo "Configured endpoint is not an approved Azure AI endpoint." >&2
              exit 1
              ;;
          esac
          token="$(az account get-access-token \
            --resource "$token_resource" \
            --query accessToken \
            --output tsv)"
          if [ -z "$token" ]; then
            echo "Azure returned an empty inference token." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          trap 'unset token' EXIT
          AZURE_OPENAI_BEARER_TOKEN="$token" npm run gallery:evaluate:model -- \
            --output artifacts/model-evaluation/report.json

      - name: Upload model evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gallery-model-evaluation-${{ github.run_id }}
          path: artifacts/model-evaluation/report.json
          if-no-files-found: error
          retention-days: 14